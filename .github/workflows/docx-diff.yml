name: DOCX Diff Viewer

on:
  pull_request:

jobs:
  docx-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Find changed DOCX files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > files.txt
          grep '\.docx$' files.txt > docx_files.txt || true

      - name: Generate Diff
        run: |
          echo "# DOCX Diff Report" > diff.md
          while read file; do
            echo "## File: $file" >> diff.md
            git show origin/${{ github.base_ref }}:$file | pandoc -t plain > old.txt || true
            pandoc "$file" -t plain > new.txt
            diff -u old.txt new.txt >> diff.md || true
          done < docx_files.txt

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: diff.md