name: DOCX Diff Viewer

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  docx-diff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Generate diff
        run: |
          echo "# DOCX Diff Report" > diff.md

          git fetch origin main

          FILE=$(git diff --name-only origin/main HEAD | grep '\.docx$' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No DOCX changes found." >> diff.md
          else
            echo "## $FILE" >> diff.md

            git show origin/main:$FILE | pandoc -t plain > old.txt || echo "" > old.txt
            pandoc "$FILE" -t plain > new.txt

            diff -u old.txt new.txt >> diff.md || true
          fi

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: diff.md