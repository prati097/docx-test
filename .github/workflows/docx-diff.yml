name: DOCX Diff Viewer

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  docx-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Generate DOCX full diff
        run: |
          echo "# DOCX Diff Report" > diff.md

          git fetch origin main

          FILE=$(git diff --name-only origin/main HEAD | grep '\.docx$' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No DOCX changes found." >> diff.md
          else
            echo "## File: $FILE" >> diff.md

            # Convert old and new versions to text
            git show origin/main:$FILE | pandoc -t plain > old.txt || echo "" > old.txt
            pandoc "$FILE" -t plain > new.txt

            # OLD VERSION
            echo "" >> diff.md
            echo "### OLD VERSION" >> diff.md
            echo '```' >> diff.md
            cat old.txt >> diff.md
            echo '```' >> diff.md

            # NEW VERSION
            echo "" >> diff.md
            echo "### NEW VERSION" >> diff.md
            echo '```' >> diff.md
            cat new.txt >> diff.md
            echo '```' >> diff.md

            # DIFF
            echo "" >> diff.md
            echo "### CHANGES" >> diff.md
            echo '```diff' >> diff.md
            diff -u --text old.txt new.txt >> diff.md || true
            echo '```' >> diff.md
          fi

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: diff.md