name: DOCX Diff Viewer

on:
  pull_request:

jobs:
  docx-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Generate DOCX diff
        run: |
          echo "# DOCX Diff Report" > diff.md

          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.docx$' || true)

          if [ -z "$FILES" ]; then
            echo "No DOCX changes found." >> diff.md
          else
            for file in $FILES; do
              echo "## File: $file" >> diff.md

              git show origin/${{ github.base_ref }}:$file | pandoc -t plain > old.txt || echo "" > old.txt
              pandoc "$file" -t plain > new.txt

              diff -u old.txt new.txt >> diff.md || true
            done
          fi

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: diff.md